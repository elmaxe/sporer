<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Spore 2 — Planet lab</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/lab/lab.css" />
  </head>
  <body class="lab">
    <div id="app"></div>
    <div id="lab-info"></div>
    <div id="planet-map" hidden>
      <div id="planet-map-head">
        <span id="planet-map-title"></span>
        <button id="planet-map-toggle" type="button" aria-expanded="true">
          <svg class="fold" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          <svg class="close" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div id="planet-map-body">
        <canvas id="planet-map-marks"></canvas>
      </div>
    </div>
    <!-- The planet map listens to the touch Map button; the lab has none on screen. -->
    <button id="touch-map" type="button" hidden></button>
    <div id="loading">Loading…</div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
