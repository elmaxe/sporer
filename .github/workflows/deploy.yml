# Checks, builds and publishes the game to GitHub Pages, one folder per version:
#   https://elmaxe.github.io/sporer/            the latest release (a pushed v* tag, e.g. from a GitHub Release)
#   https://elmaxe.github.io/sporer/preview/    main
#   https://elmaxe.github.io/sporer/pr/<n>/     every open pull request (from this repository, not forks),
#                                               linked from a comment on it; removed when it's closed or merged
# The builds live together on the gh-pages branch (scripts/pages-publish.sh), with versions.json listing them
# for the game's version picker (the menu's Version section), and releases.json holding the GitHub Releases'
# notes for the game's What's new (updated at every publish, and on its own when a release is published,
# edited or deleted). Running this workflow by hand on a tag republishes that release, e.g. to roll back.
# One-time repo setting: Settings → Pages → Source: Deploy from a branch → gh-pages, / (root).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A newer push to the same branch, tag or pull request cancels its older run; others publish side by side.
# A release's notes have a group of their own, so they never cancel the publishing of its tag. So does an edit
# of a pull request that leaves its title alone (it publishes nothing): it mustn't cancel the build under way.
concurrency:
  group: deploy-${{ github.event_name == 'release' && 'notes' || (github.event.action == 'edited' && !github.event.changes.title) && format('edit-{0}', github.run_id) || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  PR: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    # Forks' pull requests get a read-only token, so they're checked by their own CI only. A title edit
    # only needs the new label, which a rebuild gives. A release's event only updates the notes (the notes job).
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.title))
    runs-on: ubuntu-latest
    steps:
      - name: Pick the folder
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) target=release label="Release $GITHUB_REF_NAME" ref=$GITHUB_REF_NAME sha=$GITHUB_SHA ;;
            refs/heads/main) target=preview label="Preview (main)" ref=main sha=$GITHUB_SHA ;;
            refs/pull/*) target=pr/$PR label="PR #$PR: $TITLE" ref=$HEAD_REF sha=$HEAD_SHA number=$PR ;;
            refs/heads/*)
              # Run by hand on a branch: published as its open pull request's preview, if it has one.
              number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
              if [ -z "$number" ]; then
                echo "Only main, v* tags and pull requests are published, and $GITHUB_REF_NAME has no open pull request" >&2
                exit 1
              fi
              title=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
              target=pr/$number label="PR #$number: $title" ref=$GITHUB_REF_NAME sha=$GITHUB_SHA ;;
            *) echo "Only main, v* tags and pull requests are published, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          # PUBLISH_* for scripts/pages-publish.sh, BUILD_* and PAGES_PATH for the build info (vite.config.ts).
          {
            echo "TARGET=$target"
            echo "PUBLISH_LABEL=$label"
            echo "PUBLISH_REF=$ref"
            echo "PUBLISH_COMMIT=${sha:0:7}"
            echo "BUILD_BRANCH=$ref"
            echo "BUILD_COMMIT=$sha"
            echo "PAGES_PATH=$([ "$target" = release ] || echo "$target/")"
            echo "PR_NUMBER=${number:-}"
          } >>"$GITHUB_ENV"
      # A pull request's own commit (not GitHub's merge of it into main), so the build is what the branch holds.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish
        run: scripts/pages-publish.sh "$TARGET" dist
      - name: Link it from the pull request
        run: |
          [ -n "$PR_NUMBER" ] || exit 0
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/pr/$PR_NUMBER/"
          scripts/pages-pr-comment.sh "$PR_NUMBER" "**Preview:** $url (\`$PUBLISH_COMMIT\`). Also in the game's menu, under Version. It's removed when this pull request is closed."

  remove:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # main's scripts: a closed pull request's merge commit may be gone.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Remove the pull request's folder
        run: scripts/pages-publish.sh "pr/$PR"
      - name: Say so on the pull request
        run: scripts/pages-pr-comment.sh "$PR" "The preview of this pull request has been removed."

  notes:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update the release notes
        run: scripts/pages-publish.sh notes
