<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Spore 2 — Plant lab</title>
    <script type="module" crossorigin src="./assets/plants-DteWY4l4.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/FpsCounter-DMobKDYl.js">
    <link rel="modulepreload" crossorigin href="./assets/surfaceMaps-CdDDtU_Y.js">
    <link rel="modulepreload" crossorigin href="./assets/PlanetLevel-D-_7yyxA.js">
    <link rel="modulepreload" crossorigin href="./assets/page-tLkXCiU_.js">
    <link rel="modulepreload" crossorigin href="./assets/Starfield-Cm9LUmf0.js">
    <link rel="modulepreload" crossorigin href="./assets/LabLevel-Bi8wN96A.js">
    <link rel="modulepreload" crossorigin href="./assets/GroveCamera-DH32c3Rm.js">
    <link rel="stylesheet" crossorigin href="./assets/FpsCounter-DY7qxPNy.css">
    <link rel="stylesheet" crossorigin href="./assets/Starfield-rsRzmD4O.css">
  </head>
  <body class="lab plant-lab">
    <div id="app"></div>
    <div id="lab-info"></div>
    <div id="fps" hidden></div>
    <!-- The debug dump's dialog (the readout's Report button, F8), as in the game. -->
    <div id="dump" role="dialog" aria-modal="true" aria-labelledby="dump-title" hidden>
      <div id="dump-panel">
        <div class="menu-head">
          <h2 id="dump-title">Debug dump</h2>
          <button id="dump-close" type="button" aria-label="Cancel">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <p class="dump-hint">Tap the picture to mark the problem; tap a mark to remove it.</p>
        <div id="dump-picture">
          <img id="dump-image" alt="The screen when the dump was taken" draggable="false" />
          <div id="dump-marks"></div>
        </div>
        <textarea id="dump-note" rows="3" placeholder="What's wrong? What did you expect? (optional)"></textarea>
        <div class="dump-actions">
          <button id="dump-share" class="menu-button primary" type="button" hidden>Share…</button>
          <button id="dump-save" class="menu-button" type="button">Save file</button>
          <button id="dump-clear" class="menu-button" type="button" hidden>Clear marks</button>
          <button id="dump-cancel" class="menu-button" type="button">Cancel</button>
        </div>
        <p id="dump-status" class="dump-status" hidden></p>
      </div>
    </div>
    <div id="loading">Loading…</div>
  </body>
</html>
