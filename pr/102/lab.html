<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Spore 2 — Planet lab</title>
    <script type="module" crossorigin src="./assets/lab-uHo4Mjdm.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/page-DZ-bVy3m.js">
    <link rel="modulepreload" crossorigin href="./assets/GraphicsSettings-CfwB6D0N.js">
    <link rel="modulepreload" crossorigin href="./assets/LabLevel-BcvhOSRI.js">
    <link rel="stylesheet" crossorigin href="./assets/page-irAvuDm0.css">
    <link rel="stylesheet" crossorigin href="./assets/LabLevel-B6mJG9KN.css">
  </head>
  <body class="lab">
    <div id="app"></div>
    <div id="lab-info"></div>
    <div id="fps" hidden></div>
    <div id="planet-map" class="map-panel" hidden>
      <div class="map-head">
        <span id="planet-map-title" class="map-title"></span>
        <button id="planet-map-toggle" class="map-toggle" type="button" aria-expanded="true">
          <svg class="fold" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          <svg class="close" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="map-body">
        <canvas id="planet-map-marks" class="map-canvas"></canvas>
      </div>
    </div>
    <!-- The game's on-screen controls for touch players (TouchControls): the stick, Boost and Map in low orbit. -->
    <div id="touch-controls">
      <div id="touch-stick" aria-label="Move"><div id="touch-knob"></div></div>
      <div id="touch-buttons">
        <button id="touch-boost" type="button" data-key="ShiftLeft">Boost</button>
        <button id="touch-map" type="button" aria-label="Map" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z" /><path d="M9 4v13.5M15 6.5V20" />
          </svg>
        </button>
      </div>
    </div>
    <!-- The debug dump's dialog (the readout's Report button, F8), as in the game. -->
    <div id="dump" role="dialog" aria-modal="true" aria-labelledby="dump-title" hidden>
      <div id="dump-panel">
        <div class="menu-head">
          <h2 id="dump-title">Debug dump</h2>
          <button id="dump-close" type="button" aria-label="Cancel">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <p class="dump-hint">Tap the picture to mark the problem; tap a mark to remove it.</p>
        <div id="dump-picture">
          <img id="dump-image" alt="The screen when the dump was taken" draggable="false" />
          <div id="dump-marks"></div>
        </div>
        <textarea id="dump-note" rows="3" placeholder="What's wrong? What did you expect? (optional)"></textarea>
        <div class="dump-actions">
          <button id="dump-share" class="menu-button primary" type="button" hidden>Share…</button>
          <button id="dump-save" class="menu-button" type="button">Save file</button>
          <button id="dump-clear" class="menu-button" type="button" hidden>Clear marks</button>
          <button id="dump-cancel" class="menu-button" type="button">Cancel</button>
        </div>
        <p id="dump-status" class="dump-status" hidden></p>
      </div>
    </div>
    <div id="loading">Loading…</div>
  </body>
</html>
